# Only npm manifests exist in this repo. Updates target dev because
# DigitalOcean deploys main on push (.do/app.yaml).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"